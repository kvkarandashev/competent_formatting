[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61" ]

[project]
name = "competent-formatting"
version = "0.2.0"
description = "For conveniently making competent tables and figures"
readme = "README.md"
license = { text = "MIT license" }
authors = [
  { name = "Konstantin Karandashev" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click",
  "numpy",
  "pylatexenc",
]
# Everything the `cf_view` web viewer needs; the table/formatting core does not.
optional-dependencies.view = [
  "fastapi",
  "pydantic>=2",
  "sse-starlette",
  "tomli-w",
  "uvicorn",
]
scripts.cf_jcp_source = "competent_formatting.bin.jcp_source:main"

scripts.cf_macro_removal = "competent_formatting.bin.macro_removal:main"

scripts.cf_quick_table_view = "competent_formatting.bin.table_view:main"

scripts.cf_view = "competent_formatting.bin.view:main"

[tool.setuptools]
packages = [
  "competent_formatting",
  "competent_formatting.bin",
  "competent_formatting.number_formatting",
  "competent_formatting.str_formatting",
  "competent_formatting.processing",
  "competent_formatting.viewer",
]
package-data."competent_formatting.viewer" = [ "static/*" ]
